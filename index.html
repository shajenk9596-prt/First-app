<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shakenya Jenkins</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 48px 20px;
    }

    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      line-height: 1.2;
      margin: 0 0 12px;
    }

    .city {
      font-size: 1.125rem;
      margin: 0 0 24px;
    }

    .about {
      font-size: 1.125rem;
      margin: 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 32px 16px;
      }

      h1 {
        font-size: 1.875rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Shakenya Jenkins</h1>
    <p class="city">Memphis, TN</p>
    <p class="about">
      Hi, I'm Shakenya! I have a background in customer service and digital skills work.
     I love helping people solve problems, create memories, and have fun. I'm learning Google workspace, web page setup and AI partner platforms
      to start my own side hustle.
    </p>
  </main>
</body>
</html>
